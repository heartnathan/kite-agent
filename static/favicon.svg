<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kite Agent">
  <title>Kite Agent</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- 圓角底(沿用介面主色漸層 #4f7cff → #7c5cff)-->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <!-- 展翼的鸢:兩道掠翼交於下身 + 頭 -->
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
    <path d="M11 24 C22 24 28 31 32 42"/>
    <path d="M53 24 C42 24 36 31 32 42"/>
  </g>
  <circle cx="32" cy="16" r="4.6" fill="#fff"/>
</svg>
